# OpenSSF Scorecard. `specs/08-dependencies-and-release.md` requires a Scorecard
# run to be recorded before public distribution; this is that record.
#
# It is deliberately not a release gate. Scorecard grades repository practice
# (branch protection, signed releases, pinned actions) rather than the artefact,
# and several of its checks depend on repository settings that a workflow cannot
# fix. Blocking publish on it would hold releases hostage to a settings change.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Publishing the result to the public OpenSSF API, which is what makes the
      # score independently verifiable. Requires a public repository.
      id-token: write
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
