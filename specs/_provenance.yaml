approved_updates:
  - withdrew refutation cross-file retrieval on 2026-08-06, the day it shipped disabled, and removed the review.refutationRetrieval configuration block, the appended refuter prompt segment, the per-batch tool scope and its tests; a config still setting the key fails validation with exit code 2 and no compatibility shim is permitted
  - refutation retrieval is withdrawn on the removal clause of the rule pre-registered in spec 05 BEFORE the measurement - 37-case real-repository corpus on openai/gpt-5.3-codex, engine pinned c3c0c3d, n=3 per arm interleaved, zero provider errors - adjusted precision FELL 96.1% to 92.9% with genuine false positives up in every seed position (1.67 to 3.00 per run) and no recall effect (66.1% against 65.0%; 5 gained, 7 lost, 48 unchanged, sign test p = 0.7744) at +10% cost per run
  - the adjusted-precision difference is NOT formally significant at n=3 and is not recorded as if it were; the rule deliberately did not require significance for that clause, because the burden was on the feature to show it had earned its cost rather than on the control to disprove it
  - this is NOT recorded as evidence against cross-file navigation inside a verification stage in general - the controlled study it came from measured that ablation as its single largest factor, and what was measured here is one mechanism, one corpus, one model, n=3
  - three things survive the withdrawal: the typed expected-retrieval-condition disclosure (a refused tool call returns a stated result rather than an unexplained error, which applies to discovery), the mediated tool definitions collapsed back into the discovery lane rather than left stage-neutral for a stage that no longer exists, and the handler fix that unions planned tasks with the sub-tasks discovery actually ran so a partition's candidates are refuted against their own task context
  - spec 28 targeted reads is implemented while its own header still reads "Draft - awaiting human approval"; crossFileRetrieval.maxBytesPerRead is now optional and unset, repo_read accepts an optional startLine/endLine range and reports the file's total line count, and the ContextRetrievalBudget default per-read cap is 4,000,000 bytes as a memory runaway guard
  - spec 27 discovery partitioning shipped on by default at aiReview.maxFilesPerDiscoveryCall 2, chosen by a measured sweep of 1/2/4/unlimited on the 21 largest benchmark cases; 2 matched the strongest setting on both recall (46.5%) and adjusted precision (97.1%) at 27% less cost and was the only arm to reach conventional significance (p = 0.033)
  - spec 26 reactive task splitting replaced proactive byte-budget splitting; assembly no longer splits on bytes, review.contextMaxBytes is unset by default and no longer sizes the review packet, and the serialized packet ceiling is 8,000,000 bytes as a runaway guard that refuses rather than truncates
  - cross-file retrieval (spec 16) was enabled by default; the earlier net-negative verdict was refuted as an artefact of reads silently truncated at the old 24,000-byte cap, and two runs were positive on every measured dimension without reaching significance, so no recall gain is claimed
  - withdrew spec 24 invariant-conformance review on 2026-08-02 after its own step-1 firing-rate measurement was run for the first time: 7.0 reports per PR-sized range against a pre-registered kill criterion of ~0.5, and ZERO true positives across ~300 hand-judged divergences from five codebases; the whole capability was removed - the invariant-conformance and declaration-analysis domains, the conformance check command, the invariantConformance configuration block and the GitHub-integration stage - and a config still setting the block fails validation with exit code 2 with no compatibility shim permitted
  - the conformance adjudicator PASSED its own pre-registered >=95% rejection rule at 97.5% and every divergence it accepted was a false positive, two of them schema-constructor idioms accepted with a confident role-level rationale, so the rule it passed measured its silence rather than its judgement; reader precision was 0%, which is why 'it fires rarely' was not a defence
  - two root fixes the same day (c883521, 76c5b14) cut the divergence population 1,099 to 647 and the firing rate substantially; they improved the capability and did not make it correct, and this spec forbids tuning past its kill criterion
  - declaration-analysis was removed with it; spec 25 recorded that extraction as surviving its own withdrawal because spec 24 depended on it, and with spec 24 withdrawn nothing consumes it
  - recorded as a hypothesis and explicitly NOT as a result: the failure looks structural rather than parametric, because a peer set's shared shape is a fact about similarity and no measured case made similarity also a fact about obligation; nothing here shows a different peer derivation would do better, and nothing shows it would not
  - withdrew spec 25 guarded-region context on 2026-07-30 after all three measured arms failed; the implementation was removed and the spec is kept only as the record of that measurement
  - CodeReviewerConfigSchema.review now uses .prefault({}) rather than a restated default literal, because Zod's .default(value) returns the value unparsed and silently overrode every field-level default underneath it
  - added spec 24, invariant-conformance review: reports where a change stops upholding a protective pattern its peers uphold, peers cited as evidence, advisory only, firing rate measured before recall
  - added spec 22, change-impact review: a separate command reporting which dependents outside the diff relied on a contract the change altered, evidence not verdict, non-blocking by default, with its own inverse-shape corpus
  - added spec 23, intent-fulfilment review: a separate advisory-only command mapping stated obligations to evidence in the change, reusing spec 11 ingestion, gated on false-satisfied rate rather than recall
  - spec 17: expectations are classified in-diff or out-of-diff from the reviewed diff and recall is reported separately for each, after measuring 72.8% against 8.8% with 42.5% of the answer key in unchanged code
  - spec 17: added a convergence round mapping with human-authored fixes, and recorded that the current fixtures support only a pilot (2 cases with two in-diff defects in one file)
  - withdrew the discovery posture (spec 20) and removed its implementation, the review.discoveryPosture configuration key, the investigative instruction segment, and CAP-AI-008; a config still setting the key fails validation with exit code 2 and no compatibility shim is permitted
  - the posture is withdrawn on its own pre-committed rule - n=4 per arm gave recall 45.94% precise against 44.69% investigative, CI [-4.38, +1.25], p=1.0, and the candidate count FELL 74.8 to 70.8, so the intervention moved the dial it was built to move in the wrong direction
  - this is NOT recorded as evidence against the idea the posture came from - the source paired aggressive prompting with an agent that calls tools and chooses its own investigation depth, we implemented only the prompt, and this engine's discovery lane is single-shot and tools-off, so what was measured is a prompt and the source's architecture remains untested here
  - the precision movement on the investigative arm (adjusted precision 0.819 to 0.873) is recorded as a hypothesis for a pre-registered test, not as a result, because it is a post-hoc reading of an arm that failed its primary endpoint
  - withdrew independent sampling (spec 21) and removed runDiscoverySamples, the review.discoverySampleCount configuration key, the recorded sample counts, and CAP-AI-009; a config still setting the key fails validation with exit code 2 and no compatibility shim is permitted
  - sampling is withdrawn on its own pre-committed rule and on a falsified premise - k=3 against k=1 at n=3 gave +2.08pp recall (CI [-1.67, +6.25], p=0.56) while adjusted precision fell 0.819 to 0.628 and genuine false positives nearly tripled, at +67% cost; the assumed ~20pp union ceiling measured at ~4pp (single run 46.3%, post-hoc union of 3 runs 50.0%, k=3 48.3%)
  - the measured ceiling bounds IDENTICAL-INPUT resampling only - the published sources used n=10 with an aggregation call and randomised the diff order across parallel passes to force different reasoning paths, while we used k=3 with byte-identical packets, so input-perturbed sampling has a higher potential ceiling and is untested here
  - the expectation that input-perturbed sampling would still not pay is recorded as a PREDICTION and explicitly not as a measurement
  - the semantic finding merge survives the withdrawal on its own merits (78 collapses per run under the sampling arm, no one-sided loss), and the harness-wide historyWindow 0 default survives it as a requirement rehomed to spec 05 under Harness Runtime, Conversation History
  - withdrew the un-anchored discovery pass (spec 19) after its A/B failed the decision rule fixed in advance; the measured outcome is recorded in spec 05 and in reports/2026-07-27-unanchored-pass-ab-result.md
  - withdrew the context scout (spec 18) and removed its implementation, its review.contextScout configuration block, and CAP-AI-007; a config still setting the block fails validation with exit code 2 and no compatibility shim is permitted
  - the scout is withdrawn on mechanism, not on a failed measurement - its only A/B is void because it was run against a build that did not implement spec 18 (no symbol inventory was ever built, and the scout was handed the full line-numbered packet its own prompt said it did not have) and it predates the suppression of conversation history, so it was never validly tested
  - the three grounds for the withdrawal are recorded in spec 05 under Withdrawal Of The Context Scout - the reviewer largely does not read the context it already has (16 of 76 candidates inside their own unit, 2026-07-27); the cross-file blind spot it targeted was recovered by the untrusted-input guard instead; and it did not implement its own spec, six requirements unmet, so a first valid measurement would cost real work on a hypothesis the first two grounds argue against
  - this is not recorded as evidence that demand-driven or pre-assembled context is impossible; separating context selection from judgment remains untested here
  - added the semantic finding merge to spec 05: candidates for a file are grouped by whether they describe the same underlying defect before admission, by a separate model call, with the representative chosen deterministically in code
  - superseded deterministic extractor promotion with deterministic support signals
  - selected holistic whole-file discovery, per-candidate refutation, and admission policy as the review-quality architecture
  - selected ast-grep as an optional generic structural parsing layer for support signals with Tree-sitter fallback evidence
